name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  APP_NAME: node-ytdwnld
  IMAGE_NAME: node-ytdwnld
  COMPOSE_FILE: compose.prod.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .

      - name: Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }} | gzip > ${{ env.IMAGE_NAME }}.tar.gz

      - name: Copy image to ${{ secrets.SSH_HOST }}
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.IMAGE_NAME }}.tar.gz"
          target: "~/docker/images/"

      - name: Copy ${{ env.COMPOSE_FILE }} to ${{ secrets.SSH_HOST }}
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.COMPOSE_FILE }}"
          target: "/opt/${{ env.APP_NAME }}"

      - name: Deploy on ${{ secrets.SSH_HOST }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/${{ env.APP_NAME }}

            docker load < ~/docker/images/${{ env.IMAGE_NAME }}.tar.gz

            docker compose -f ${{ env.COMPOSE_FILE }} down || true
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans
            
            docker image prune -f
