name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  APP_NAME: node-ytdwnld
  IMAGE_NAME: node-ytdwnld
  COMPOSE_FILE: compose.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_NAME }}:latest

      - name: Copy ${{ env.COMPOSE_FILE }} to ${{ secrets.SSH_HOST }}
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.COMPOSE_FILE }}"
          target: "~/docker/${{ env.APP_NAME }}"

      - name: Deploy on ${{ secrets.SSH_HOST }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            cd ~/docker/${{ env.APP_NAME }}

            docker compose down || true
            docker compose up -d --remove-orphans

            docker image prune -f
